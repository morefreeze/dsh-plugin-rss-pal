name: 功能建议 / Feature request
description: 分享使用场景与改进想法 / Suggest a feature or improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有建议，不要提交私人订阅或文章内容。 / Search existing requests and omit private content.
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与现有问题 / Use case and current problem
      description: 你想完成什么，目前哪里不方便？ / What are you trying to do, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望效果 / Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案 / Alternatives considered
